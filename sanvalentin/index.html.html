<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>San Valentín 💘</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e0, #fff1f5);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 420px;
    }
    h1 {
      color: #e63946;
    }
    p {
      color: #444;
      font-size: 16px;
      line-height: 1.6;
    }
    button {
      margin-top: 25px;
      padding: 12px 24px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      background: #e63946;
      color: white;
    }
    button:hover {
      background: #d62839;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>💖 ¿Quieres ser mi San Valentín? 💖</h1>
    <p>
      Este 14 de febrero no prometo cosas caras<br>
      ni una cena elegante.<br><br>

      Te prometo algo bonito,<br>
      hecho con cariño y ganas.<br><br>

      Ya llegará Sant Jordi<br>
      para hacerlo aún mejor 🌹
    </p>
    <button onclick="alert('me haces el dia con tu si ARIIII💘')">
      Sí 🥰
    </button>
  </div>
</body>
</html>
